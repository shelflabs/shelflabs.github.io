<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Frame Shadow / Border -->
  <rect x="1" y="1" width="14" height="14" fill="#181d27" />
  <!-- Main Wood Outer Frame -->
  <rect x="2" y="2" width="12" height="12" fill="#8b5a2b" />
  <!-- Top Highlight -->
  <rect x="2" y="2" width="12" height="1" fill="#ba7d4e" />

  <!-- Inner Back Panel Top -->
  <rect x="3" y="3" width="10" height="4" fill="#5c3818" />
  <!-- Middle Shelf Divider -->
  <rect x="2" y="7" width="12" height="2" fill="#3d240e" />
  <rect x="2" y="7" width="12" height="1" fill="#ba7d4e" />
  <!-- Inner Back Panel Bottom -->
  <rect x="3" y="9" width="10" height="4" fill="#5c3818" />
  <!-- Bottom Base -->
  <rect x="2" y="13" width="12" height="1" fill="#3d240e" />

  <!-- Top Shelf Books -->
  <rect x="4" y="3" width="2" height="4" fill="#f87171" />
  <rect x="4" y="4" width="2" height="1" fill="#fef2f2" />
  <rect x="7" y="3" width="2" height="4" fill="#fcd34d" />
  <rect x="10" y="3" width="2" height="4" fill="#86efac" />

  <!-- Bottom Shelf Books -->
  <rect x="4" y="9" width="2" height="4" fill="#60a5fa" />
  <rect x="7" y="9" width="3" height="4" fill="#d96b52" />
  <rect x="11" y="9" width="2" height="4" fill="#fcd34d" />
</svg>
